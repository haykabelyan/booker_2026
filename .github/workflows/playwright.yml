name: Playwright Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      test_tag:
        description: 'Choose which tests to run'
        required: true
        default: all
        type: choice
        options:
          - all
          - '@ping'
          - '@auth'
          - '@get'
          - '@create'
          - '@filter'
          - '@update'
          - '@put'
          - '@patch'
          - '@delete'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # Загружает код репозитория в runner, чтобы workflow мог запускать тесты.
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Устанавливает Node.js и включает кеш npm для ускорения следующих запусков.
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Устанавливает зависимости строго по package-lock.json.
        run: npm ci

      - name: Install Playwright browsers
        # Устанавливает браузеры Playwright и системные зависимости для Linux.
        run: npx playwright install --with-deps

      - name: Run all Playwright tests
        # По умолчанию запускает весь набор тестов.
        if: ${{ github.event.inputs.test_tag == '' || github.event.inputs.test_tag == 'all' }}
        run: npx playwright test

      - name: Run Playwright tests by @ping
        # Запускает только тесты, в названии которых есть тег @booker.
        if: ${{ github.event.inputs.test_tag == '@ping' }}
        run: npx playwright test --grep "@ping"

      - name: Run Playwright tests by @auth
        # Запускает только тесты, в названии которых есть тег @auth.
        if: ${{ github.event.inputs.test_tag == '@auth' }}
        run: npx playwright test --grep "@auth"

      - name: Run Playwright tests by @get
        # Запускает только тесты, в названии которых есть тег @get.
        if: ${{ github.event.inputs.test_tag == '@get' }}
        run: npx playwright test --grep "@get"

      - name: Run Playwright tests by @create
        # Запускает только тесты, в названии которых есть тег @posts.
        if: ${{ github.event.inputs.test_tag == '@create' }}
        run: npx playwright test --grep "@create"

      - name: Run Playwright tests by @filter
        # Запускает только тесты, в названии которых есть тег @posts.
        if: ${{ github.event.inputs.test_tag == '@filter' }}
        run: npx playwright test --grep "@filter"


      - name: Run Playwright tests by @update
        # Запускает только тесты, в названии которых есть тег @posts.
        if: ${{ github.event.inputs.test_tag == '@update' }}
        run: npx playwright test --grep "@update"

      - name: Run Playwright tests by @put
        # Запускает только тесты, в названии которых есть тег @posts.
        if: ${{ github.event.inputs.test_tag == '@put' }}
        run: npx playwright test --grep "@put"

      - name: Run Playwright tests by @patch
        # Запускает только тесты, в названии которых есть тег @posts.
        if: ${{ github.event.inputs.test_tag == '@patch' }}
        run: npx playwright test --grep "@patch"

      - name: Run Playwright tests by @delete
        # Запускает только тесты, в названии которых есть тег @posts.
        if: ${{ github.event.inputs.test_tag == '@delete' }}
        run: npx playwright test --grep "@delete"


      - name: Upload Playwright report
        # Сохраняет HTML-отчет даже если тесты упали.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
